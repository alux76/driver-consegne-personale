{% extends "base.html" %}

{% block title %}Nuova consegna{% endblock %}

{% block content %}
<h2>➕ Nuova consegna</h2>

<form method="POST" id="formConsegna">
    <fieldset>
        <legend>📦 Dati commerciante (richiedente)</legend>
        
        <label style="font-weight: bold; color: black;">Nome attività:</label>
        <input type="text" name="comm_nome" id="comm_nome" required>
        <br><br>
        
        <label style="font-weight: bold; color: black;">Telefono:</label>
        <input type="tel" name="comm_telefono" id="comm_telefono" required>
        <br><br>
        
        <label style="font-weight: bold; color: black;">Indirizzo partenza:</label>
        <input type="text" name="comm_indirizzo_partenza" id="comm_indirizzo" required placeholder="es. Via Roma 1, Grottaglie">
        <br><br><br>
    </fieldset>
    
    <fieldset>
        <legend>👤 Cliente destinatario</legend>
        
        <label style="font-weight: bold; color: black;">Cerca cliente (opzionale):</label>
        <input type="text" id="ricerca_cliente" placeholder="Inizia a scrivere il nome...">
        <div id="risultati_clienti" style="border:1px solid #ccc; background:white; max-height:150px; overflow-y:auto; display:none;"></div>
        <br><br>
        
        <label style="font-weight: bold; color: black;">Nome cliente:</label>
        <input type="text" name="cliente_nome" id="cliente_nome" required>
        <br><br>
        
        <label style="font-weight: bold; color: black;">Telefono cliente:</label>
        <input type="tel" name="cliente_telefono" id="cliente_telefono" required>
        <br><br>
        
        <label style="font-weight: bold; color: black;">Indirizzo consegna:</label>
        <input type="text" name="cliente_indirizzo_consegna" id="cliente_indirizzo" required placeholder="es. Via Lecce 10, Grottaglie">
        <br><br>
        
        <label style="font-weight: bold; color: black;">Piano:</label>
        <select name="cliente_piano" id="piano">
            <option value="0">0 (terra)</option>
            <option value="1">1 (+0.50€)</option>
            <option value="2">2 (+1.00€)</option>
            <option value="3">3 (+1.50€)</option>
            <option value="4">4 (+2.00€)</option>
        </select>
        <br>
        <small>Dal piano 1: +0.50€ a piano</small>
        <br><br>
        
        <label style="font-weight: bold; color: black;">Note:</label>
        <textarea name="cliente_note" rows="2"></textarea>
        <br><br><br>
    </fieldset>
    
    <fieldset>
        <legend>🚗 Dettagli consegna</legend>
        
        <label style="font-weight: bold; color: black;">📌 Tipo consegna (extra):</label>
        <select name="supplemento_extra" id="supplemento_extra">
            <option value="0">Standard (0€)</option>
            <option value="2">🌙 Notturna (dopo 22:00) +2€</option>
            <option value="2">🎉 Festiva +2€</option>
            <option value="3">🏞️ Campagna (fuori paese) +3€</option>
        </select>
        <br><br>
        
        <label style="font-weight: bold; color: black;">
            <input type="checkbox" name="fragile" id="fragile">
            📦 Consegna fragile (+1€)
        </label>
        <br><br>
        
        <label style="font-weight: bold; color: black;">📅 Data e ora consegna (obbligatorio):</label>
        <input type="datetime-local" name="orario_richiesto" id="orario_richiesto" required value="{{ orario_pre }}">
        <br><br>
        
        <div id="preventivo_anteprima" style="margin-top: 15px; padding: 10px; background: #d4edda; border-radius: 5px;">
            <strong>💰 Preventivo: </strong><span id="totale_anteprima">3.00</span>€
        </div>
    </fieldset>
    
    <button type="submit" class="btn">✅ Crea consegna</button>
</form>

<script>
    const pianoSelect = document.getElementById('piano');
    const fragileCheck = document.getElementById('fragile');
    const extraSelect = document.getElementById('supplemento_extra');
    const totaleSpan = document.getElementById('totale_anteprima');
    
    function aggiornaPreventivo() {
        const piano = parseInt(pianoSelect.value) || 0;
        const fragile = fragileCheck.checked;
        const extra = parseFloat(extraSelect.value) || 0;
        
        fetch('/api/calcola_preventivo', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({piano: piano, fragile: fragile, extra: extra})
        })
        .then(res => res.json())
        .then(data => {
            totaleSpan.textContent = data.totale;
        })
        .catch(() => {
            let totale = 3.0;
            if (piano > 0) totale += piano * 0.50;
            if (fragile) totale += 1.0;
            totale += extra;
            totaleSpan.textContent = totale.toFixed(2);
        });
    }
    
    pianoSelect.addEventListener('change', aggiornaPreventivo);
    fragileCheck.addEventListener('change', aggiornaPreventivo);
    extraSelect.addEventListener('change', aggiornaPreventivo);
    
    aggiornaPreventivo();
    
    // ========== CARICAMENTO DATI COMMERCIANTE ==========
    const telefonoComm = document.getElementById('comm_telefono').value;
    if (telefonoComm) {
        fetch(`/api/carica_commerciante?telefono=${encodeURIComponent(telefonoComm)}`)
            .then(res => res.json())
            .then(data => {
                if (data.success && data.dati) {
                    document.getElementById('comm_nome').value = data.dati.nome || '';
                    document.getElementById('comm_indirizzo').value = data.dati.indirizzo_partenza || '';
                }
            });
    }
    
    // Salva i dati del commerciante quando invia il form
    const form = document.getElementById('formConsegna');
    form.addEventListener('submit', function() {
        const telefono = document.getElementById('comm_telefono').value;
        const nome = document.getElementById('comm_nome').value;
        const indirizzo = document.getElementById('comm_indirizzo').value;
        
        fetch('/api/salva_commerciante', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                telefono: telefono,
                nome: nome,
                indirizzo_partenza: indirizzo
            })
        });
    });
    
    // ========== AUTOCOMPLETAMENTO CLIENTI ==========
    const ricercaCliente = document.getElementById('ricerca_cliente');
    const risultatiDiv = document.getElementById('risultati_clienti');
    const clienteNome = document.getElementById('cliente_nome');
    const clienteTelefono = document.getElementById('cliente_telefono');
    const clienteIndirizzo = document.getElementById('cliente_indirizzo');
    let timeoutId;
    
    ricercaCliente.addEventListener('input', function() {
        clearTimeout(timeoutId);
        const query = this.value.trim();
        if (query.length < 2) {
            risultatiDiv.style.display = 'none';
            return;
        }
        
        timeoutId = setTimeout(() => {
            const telefonoCommerciante = document.getElementById('comm_telefono').value;
            if (!telefonoCommerciante) return;
            
            fetch(`/api/cerca_clienti?q=${encodeURIComponent(query)}&telefono=${encodeURIComponent(telefonoCommerciante)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.length === 0) {
                        risultatiDiv.style.display = 'none';
                        return;
                    }
                    risultatiDiv.innerHTML = data.map(c => 
                        `<div style="padding: 8px; cursor: pointer; border-bottom:1px solid #eee;" 
                              onclick="selezionaCliente('${c.nome}', '${c.telefono}', '${c.indirizzo || ''}')">
                            <strong>${c.nome}</strong> - ${c.telefono}<br>
                            <small>${c.indirizzo || 'Indirizzo non salvato'}</small>
                         </div>`
                    ).join('');
                    risultatiDiv.style.display = 'block';
                });
        }, 300);
    });
    
    function selezionaCliente(nome, telefono, indirizzo) {
        clienteNome.value = nome;
        clienteTelefono.value = telefono;
        clienteIndirizzo.value = indirizzo;
        ricercaCliente.value = '';
        risultatiDiv.style.display = 'none';
    }
    
    document.addEventListener('click', function(e) {
        if (!ricercaCliente.contains(e.target) && !risultatiDiv.contains(e.target)) {
            risultatiDiv.style.display = 'none';
        }
    });
</script>
{% endblock %}
