{% extends "base.html" %}

{% block title %}Nuova consegna{% endblock %}

{% block content %}
<h2>➕ Nuova consegna</h2>

<form method="POST" id="formConsegna">
    <fieldset>
        <legend>📦 Dati commerciante (richiedente)</legend>
        <label>Nome attività:</label>
        <input type="text" name="comm_nome" required>
        
        <label>Telefono:</label>
        <input type="tel" name="comm_telefono" required>
        
        <label>Indirizzo partenza:</label>
        <input type="text" name="comm_indirizzo_partenza" required>
    </fieldset>
    
    <fieldset>
        <legend>👤 Cliente destinatario</legend>
        <label>Nome cliente:</label>
        <input type="text" name="cliente_nome" required>
        
        <label>Telefono cliente:</label>
        <input type="tel" name="cliente_telefono" required>
        
        <label>Indirizzo consegna:</label>
        <input type="text" name="cliente_indirizzo_consegna" required>
        
        <label>Piano:</label>
        <input type="number" name="cliente_piano" value="0" min="0">
        
        <label>Note:</label>
        <textarea name="cliente_note" rows="2"></textarea>
    </fieldset>
    
    <fieldset>
        <legend>🚗 Dettagli consegna</legend>
        <label>Km stimati:</label>
        <input type="number" name="km" step="0.1" id="km" required>
        
        <label>
            <input type="checkbox" name="fragile" id="fragile">
            📦 Consegna fragile (+1€)
        </label>
        
        <div id="preventivo_anteprima" style="margin-top: 15px; padding: 10px; background: #f0f0f0; border-radius: 5px;">
            <strong>💰 Preventivo: </strong><span id="totale_anteprima">0.00</span>€
        </div>
    </fieldset>
    
    <button type="submit" class="btn">✅ Crea consegna e calcola preventivo</button>
</form>

<script>
    const kmInput = document.getElementById('km');
    const pianoInput = document.querySelector('input[name="cliente_piano"]');
    const fragileCheck = document.getElementById('fragile');
    const totaleSpan = document.getElementById('totale_anteprima');
    
    function aggiornaPreventivo() {
        const km = parseFloat(kmInput.value) || 0;
        const piano = parseInt(pianoInput.value) || 0;
        const fragile = fragileCheck.checked;
        
        fetch('/api/calcola_preventivo', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({km: km, piano: piano, fragile: fragile})
        })
        .then(res => res.json())
        .then(data => {
            totaleSpan.textContent = data.totale;
        });
    }
    
    kmInput.addEventListener('input', aggiornaPreventivo);
    pianoInput.addEventListener('input', aggiornaPreventivo);
    fragileCheck.addEventListener('change', aggiornaPreventivo);
    aggiornaPreventivo();
</script>
{% endblock %}
